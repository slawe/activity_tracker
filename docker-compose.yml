services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      SESSION_NAME: ${SESSION_NAME:-activity_tracker_session}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-activity_tracker}
      DB_USERNAME: ${DB_USERNAME:-activity_tracker}
      DB_PASSWORD: ${DB_PASSWORD:-activity_tracker}
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-activity_tracker}
      MYSQL_USER: ${DB_USERNAME:-activity_tracker}
      MYSQL_PASSWORD: ${DB_PASSWORD:-activity_tracker}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
